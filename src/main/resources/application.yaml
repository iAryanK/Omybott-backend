spring:
  application:
    name: omybott
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omybottdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    user:
      name: aryan
      password: admin
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:testId}
            client-secret: ${GOOGLE_CLIENT_SECRET:testSecret}
  ai:
    model:
      embedding: none
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: ${GROQ_CHAT_MODEL:llama-3.3-70b-versatile}
        temperature: 0.7

nomic:
  embedding:
    api-key: ${NOMIC_API_KEY}
    model: ${NOMIC_EMBEDDING_MODEL:nomic-embed-text-v1.5}
    dimensionality: 768

deploy:
  env: ${DEPLOY_ENV:development}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secretKey: ${JWT_SECRET_KEY:qwertyuiopasdfghjklzxcvbnmmnbvcxzlkjhgfdsapiuytrewq}
logging:
  level:
    root: INFO
    org.springframework.ai:
      chat.client: DEBUG